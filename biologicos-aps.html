<!-- Firebase SDK -->
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,collection,getDocs,addDoc,query,orderBy,where,onSnapshot,writeBatch,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const FB={
  apiKey:"AIzaSyC54FoT4a3EwdcuhsdImyQBo2i9ca7jvqM",
  authDomain:"softaps-chicoana.firebaseapp.com",
  projectId:"softaps-chicoana"
};
const app=initializeApp(FB);
const db=getFirestore(app);

// ── Colecciones ──────────────────────────────────────────────
const COL_USERS   ='bio_usuarios';
const COL_ITEMS   ='bio_lotes';
const COL_DOCS    ='bio_movimientos';
const COL_DEST    ='bio_destinos';
const COL_CATALOG ='bio_catalogo';
const COL_DISPOS  ='bio_descartables';
const COL_DESCAT  ='bio_catalogo_des';// catálogo de referencia de descartables
const COL_REQ     ='bio_pedidos';
const COL_CFG     ='bio_config';

// ── Hash simple para contraseñas (SHA-256 via crypto) ────────
async function hashPass(plain){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(plain));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// ── Estado global ────────────────────────────────────────────
const sectors=['20 DE FEBRERO','JUAN PABLO','LOS LOS','LA CANDELARIA','PARQUE LA CRUZ','LAS MORAS','CHIVILME','PULARES','POTRERO DE DIAZ - LA ROTONDA','BELLA VISTA','LAS PALTAS','LA TRADICION','ESCOIPE - LA ROTONDA','LA ZANJA - LA ROTONDA','SAN CAYETANO','CAMINO AL CHURCAL'];
const defaultKinds=['Sector APS','Centro Materno','Puesto Sanitario','Centro de Salud','Otro efector'];

let users=[],docs=[],items=[],disposables=[],bioCatalog=[],desCatalog=[],customDestinations=[],kinds=[...defaultKinds];
let page='Acceso',role='vacunador',sessionAccount=null,activeFacilityId='aps:1',activeSector=1,moveCategory='',movementFilter='Todos';
let nextDoc=1,monthlyRequests={};
let requestMonth=(()=>{let d=new Date();return new Date(d.getFullYear(),d.getMonth()+1,1).toISOString().slice(0,7)})();
let fbReady=false;

// ── Helpers UI ───────────────────────────────────────────────
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts=sectors.map((s,i)=>`<option value="${i+1}">${i+1} — ${esc(s)}</option>`).join('');
const selectSector=(id,blank='Seleccionar sector')=>`<select id="${id}"><option value="">${blank}</option>${opts}</select>`;

// ── Tema ── variable global, no depende de localStorage para funcionar
let currentTheme='dark';
function applyTheme(theme){
  currentTheme=theme;
  let resolved=theme;
  if(theme==='auto') resolved=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  document.documentElement.dataset.theme=resolved;
  // intentar persistir, pero no es crítico
  try{localStorage.setItem('aps-biologicos-theme',theme)}catch(e){}
  // actualizar botón de tema si existe
  const btn=document.getElementById('themeCycleBtn');
  if(btn){const labels={dark:'🌙 Oscuro — tocar para cambiar',light:'☀️ Claro — tocar para cambiar',auto:'⚙️ Sistema — tocar para cambiar'};btn.textContent=labels[theme]||labels.dark;}
}
function toggleTheme(){
  const next=currentTheme==='dark'?'light':currentTheme==='light'?'auto':'dark';
  applyTheme(next);
}
window.toggleTheme=toggleTheme;
window.applyTheme=applyTheme;
// arrancar con el tema guardado o dark por defecto
try{applyTheme(localStorage.getItem('aps-biologicos-theme')||'dark')}catch(e){applyTheme('dark')}

// ── Carga inicial desde Firestore ────────────────────────────
async function cargarTodo(){
  try{
    // Usuarios
    const uSnap=await getDocs(collection(db,COL_USERS));
    users=uSnap.docs.map(d=>({id:d.id,...d.data()}));

    // Items (lotes biológicos) — sin datos demo; el stock real se carga desde Recepción OCASA
    const iSnap=await getDocs(collection(db,COL_ITEMS));
    items=iSnap.docs.map(d=>({_id:d.id,...d.data()}));

    // Movimientos
    const mSnap=await getDocs(query(collection(db,COL_DOCS),orderBy('createdAt','desc')));
    docs=mSnap.docs.map(d=>({_id:d.id,...d.data()}));

    // Destinos personalizados
    const dSnap=await getDocs(collection(db,COL_DEST));
    customDestinations=dSnap.docs.map(d=>({id:d.id,...d.data()}));

    // Catálogo biológicos
    const cSnap=await getDocs(collection(db,COL_CATALOG));
    bioCatalog=cSnap.docs.map(d=>({_id:d.id,...d.data()}));
    if(!bioCatalog.length)bioCatalog=[...new Set(items.map(x=>x.name))].map(name=>({name,active:true}));

    // Descartables (stock)
    const disSnap=await getDocs(collection(db,COL_DISPOS));
    disposables=disSnap.docs.map(d=>({_id:d.id,...d.data()}));

    // Catálogo de descartables (referencia, sin stock)
    const desCatSnap=await getDocs(collection(db,COL_DESCAT));
    desCatalog=desCatSnap.docs.map(d=>({_id:d.id,...d.data()}));
    // Si el catálogo está vacío, lo pre-poblamos con los descartables ya en stock
    if(!desCatalog.length&&disposables.length){
      for(const d of disposables){
        const ref=doc(collection(db,COL_DESCAT));
        desCatalog.push({_id:ref.id,name:d.name,active:true});
        await setDoc(ref,{name:d.name,active:true});
      }
    }

    // Tipos de destino
    const cfgSnap=await getDoc(doc(db,COL_CFG,'destino-kinds'));
    if(cfgSnap.exists())kinds=cfgSnap.data().kinds||[...defaultKinds];

    // Contador docs
    const cntSnap=await getDoc(doc(db,COL_CFG,'next-doc'));
    if(cntSnap.exists())nextDoc=cntSnap.data().value||1;

    // Pedidos mensuales
    const rSnap=await getDocs(collection(db,COL_REQ));
    rSnap.docs.forEach(d=>{monthlyRequests[d.id]={id:d.id,...d.data()}});

    fbReady=true;
    $('fb-loading').style.display='none';
    document.querySelector('header').style.display='none';
    render();

    // Crear admin por defecto si no existe
    if(!users.find(u=>u.email==='ramon')){
      const h=await hashPass('aps2026');
      await setDoc(doc(db,COL_USERS,'admin-ramon'),{name:'Ramón López',email:'ramon',passHash:h,role:'Administrador',facilityIds:['aps:1'],active:true,createdAt:new Date().toISOString()});
      users.push({id:'admin-ramon',name:'Ramón López',email:'ramon',passHash:h,role:'Administrador',facilityIds:['aps:1'],active:true});
    }
  }catch(e){
    console.error(e);
    $('fb-loading').innerHTML=`<div style="color:#f87171;text-align:center;padding:20px"><b>⚠ Error de conexión Firebase</b><br><small>${e.message}</small><br><br><button onclick="location.reload()" style="border:0;border-radius:10px;background:#1978c7;color:#fff;padding:12px 24px;font-size:16px;cursor:pointer;margin-top:12px">Reintentar</button></div>`;
  }
}

// ── Persistencia Firestore ───────────────────────────────────
async function persistItem(item){
  if(item._id){
    await setDoc(doc(db,COL_ITEMS,item._id),itemData(item));
  }else{
    const ref=await addDoc(collection(db,COL_ITEMS),itemData(item));
    item._id=ref.id;
  }
}
function itemData(x){return{name:x.name,lot:x.lot||'',exp:x.exp||'',qty:Number(x.qty)||0,presentation:x.presentation||''}}

async function persistDoc(d){
  const ref=await addDoc(collection(db,COL_DOCS),{...d,createdAt:serverTimestamp()});
  d._id=ref.id;
  // Actualizar contador
  await setDoc(doc(db,COL_CFG,'next-doc'),{value:nextDoc});
}

async function persistUsers(){
  const batch=writeBatch(db);
  users.forEach(u=>{
    const {id,...data}=u;
    if(id)batch.set(doc(db,COL_USERS,id),data);
  });
  await batch.commit();
}

async function persistDestCatalog(){
  const batch=writeBatch(db);
  customDestinations.forEach(d=>{const{id,...data}=d;if(id)batch.set(doc(db,COL_DEST,id),data);});
  await setDoc(doc(db,COL_CFG,'destino-kinds'),{kinds});
  await batch.commit();
}

async function persistCatalog(){
  const batch=writeBatch(db);
  bioCatalog.forEach(b=>{
    if(b._id)batch.set(doc(db,COL_CATALOG,b._id),{name:b.name,active:b.active!==false});
    else{const ref=doc(collection(db,COL_CATALOG));b._id=ref.id;batch.set(ref,{name:b.name,active:true});}
  });
  await batch.commit();
}

async function persistDisposables(){
  const batch=writeBatch(db);
  disposables.forEach(d=>{
    const data={name:d.name,qty:d.qty,unit:d.unit||'unidades',lot:d.lot||'',exp:d.exp||''};
    if(d._id)batch.set(doc(db,COL_DISPOS,d._id),data);
    else{const ref=doc(collection(db,COL_DISPOS));d._id=ref.id;batch.set(ref,data);}
  });
  await batch.commit();
}
async function persistDisposable(d){
  const data={name:d.name,qty:d.qty,unit:d.unit||'unidades',lot:d.lot||'',exp:d.exp||''};
  if(d._id)await setDoc(doc(db,COL_DISPOS,d._id),data);
  else{const ref=doc(collection(db,COL_DISPOS));d._id=ref.id;await setDoc(ref,data);}
}

window.createLot=async function(){
  if(role!=='administrador')return;
  let name=$('lotBio').value,lot=$('lotCode').value.trim(),exp=$('lotExpiry').value,unit=$('lotPresentation').value.trim();
  if(!name||!lot||!exp)return alert('Seleccioná biológico, lote y vencimiento.');
  if(exp<new Date().toLocaleDateString('en-CA'))return alert('No se puede incorporar un lote vencido.');
  if(items.some(x=>x.name.toLowerCase()===name.toLowerCase()&&x.lot.toLowerCase()===lot.toLowerCase()))return alert('Este lote ya está registrado. Usá Recepción OCASA.');
  const initQtyRaw=Number($('lotInitQty')?.value||0);
  const initQty=Number.isInteger(initQtyRaw)&&initQtyRaw>0?initQtyRaw:0;
  const newItem={name,lot,exp,qty:initQty,presentation:unit};
  const ref=doc(collection(db,COL_ITEMS));newItem._id=ref.id;
  await setDoc(ref,itemData(newItem));
  items.push(newItem);
  if(initQty>0){
    const movDoc={type:'Comprobación',date:new Date().toLocaleDateString('en-CA'),category:'Biológicos',itemRef:newItem._id,qty:initQty,place:'Carga inicial de existencias',person:role,comment:'Stock inicial al registrar el lote'};
    await persistDoc(movDoc);
    docs.unshift(movDoc);
  }
  render();
  alert(initQty>0?`Lote creado con ${initQty} dosis en existencia.`:'Lote creado sin existencias. Para cargar dosis usá Recepción OCASA.');
};
window.editLot=async function(i){
  if(role!=='administrador')return;
  let x=items[i];
  let lot=prompt('Número de lote',x.lot)?.trim();
  if(!lot)return;
  let exp=prompt('Vencimiento (AAAA-MM-DD)',x.exp)?.trim();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(exp)||!Number.isFinite(Date.parse(exp)))return alert('Fecha inválida.');
  if(items.some((v,j)=>i!==j&&v.name.toLowerCase()===x.name.toLowerCase()&&v.lot.toLowerCase()===lot.toLowerCase()))return alert('Ese lote ya existe.');
  let qtyStr=prompt('Existencias actuales (dosis)',String(x.qty));
  if(qtyStr===null)return;
  let newQty=Number(qtyStr);
  if(!Number.isInteger(newQty)||newQty<0)return alert('Cantidad inválida.');
  if(!confirm('Modificar la ficha del lote requiere verificar la documentación original. ¿Continuar?'))return;
  x.lot=lot;x.exp=exp;x.qty=newQty;
  await persistItem(x);
  render();
};

window.createDesStock=async function(){

function bioManagement(){if(role!=='administrador')return'<div class="panel">Función exclusiva del administrador.</div>';return`<div class="panel"><h1>Gestión de biológicos</h1><p class="muted">Primero registrá el nombre en el catálogo, después el lote con su vencimiento y stock inicial. Los remitos OCASA siguientes suman a ese stock.</p><div class="admin-guide">Los datos se guardan en Firebase Firestore y se sincronizan en todos los dispositivos.</div><h2>1. Catálogo de biológicos</h2><div class="grid"><div class="field"><label>Nombre del biológico</label><input id="bioNewName" placeholder="Ej. Quíntuple"></div></div><button class="action" onclick="createBio()">+ Agregar biológico</button> <button class="action secondary" id="bioCatBtn" onclick="var t=$('bioCatTable'),b=$('bioCatBtn'),open=t.style.display!=='none';t.style.display=open?'none':'';b.textContent=open?'Ver catálogo (${bioCatalog.length})':'Ocultar catálogo';">Ver catálogo (${bioCatalog.length})</button><div class="tablewrap" id="bioCatTable" style="margin-top:14px;display:none"><table><thead><tr><th>Biológico</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${bioCatalog.map((b,i)=>`<tr><td>${esc(b.name)}</td><td>${b.active===false?'Inactivo':'Activo'}</td><td><button class="action secondary" onclick="editBio(${i})">Editar</button> <button class="action secondary" onclick="toggleBio(${i})">${b.active===false?'Activar':'Desactivar'}</button></td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h2>2. Catálogo de descartables</h2><p class="muted">Los insumos registrados acá aparecen como opciones en Recepción OCASA. El stock se actualiza al confirmar el remito.</p><div class="grid"><div class="field"><label>Nombre del insumo</label><input id="desNewName" placeholder="Ej. Jeringa 0,5 ml"></div></div><button class="action" onclick="createDes()">+ Agregar insumo</button> <button class="action secondary" id="desCatBtn" onclick="var t=$('desCatTable'),b=$('desCatBtn'),open=t.style.display!=='none';t.style.display=open?'none':'';b.textContent=open?'Ver catálogo (${desCatalog.length})':'Ocultar catálogo';">Ver catálogo (${desCatalog.length})</button><div class="tablewrap" id="desCatTable" style="margin-top:14px;display:none"><table><thead><tr><th>Insumo</th><th>Estado</th><th></th></tr></thead><tbody>${desCatalog.map((d,i)=>`<tr><td>${esc(d.name)}</td><td>${d.active===false?'Inactivo':'Activo'}</td><td><button class="action secondary" onclick="toggleDes(${i})">${d.active===false?'Activar':'Desactivar'}</button></td></tr>`).join('')||'<tr><td colspan="3" class="empty">Sin insumos. Agregá el primero arriba.</td></tr>'}</tbody></table></div><h2 style="margin-top:20px">Cargar stock inicial de insumo</h2><p class="muted">Para arrancar con existencias ya en depósito. Los remitos OCASA siguientes suman a este stock.</p><div class="grid"><div class="field"><label>Insumo</label><select id="desStockName"><option value="">Seleccionar</option>${desCatalogOptions()}</select></div><div class="field"><label>Número de lote</label><input id="desStockLot" placeholder="Lote impreso en el envase"></div><div class="field"><label>Fecha de vencimiento</label><input id="desStockExp" type="date"></div><div class="field"><label>Existencias iniciales (unidades)</label><input id="desStockQty" type="number" inputmode="numeric" min="1" step="1" placeholder="Ej. 200"></div></div><button class="action" onclick="createDesStock()">Cargar stock inicial</button></div><div class="panel"><h2>3. Registrar un lote de biológico</h2><div class="grid"><div class="field"><label>Biológico</label><select id="lotBio"><option value="">Seleccionar</option>${catalogOptions()}</select></div><div class="field"><label>Número de lote</label><input id="lotCode" placeholder="Lote impreso en el envase"></div><div class="field"><label>Fecha de vencimiento</label><input id="lotExpiry" type="date"></div><div class="field"><label>Presentación (opcional)</label><input id="lotPresentation" placeholder="Ej. Monodosis"></div><div class="field"><label>Existencias iniciales (opcional)</label><input id="lotInitQty" type="number" inputmode="numeric" min="0" step="1" placeholder="0 — dejá vacío si no tenés stock aún"></div></div><button class="action" onclick="createLot()">Guardar lote</button><h2 style="margin-top:20px">Lotes registrados</h2><p class="muted">Los lotes con stock cero se archivan automáticamente en la vista operativa; permanecen en el historial.</p><button class="action secondary" onclick="toggleArchiveView()">${window.showArchived?'Ocultar lotes agotados':'Ver lotes agotados ('+archivedLotCount()+')'}</button><div class="tablewrap"><table><thead><tr><th>Biológico</th><th>Lote</th><th>Vencimiento</th><th>Dosis</th><th>Acción</th></tr></thead><tbody>${items.map((x,i)=>({x,i})).filter(({x})=>window.showArchived||x.qty>0).map(({x,i})=>`<tr><td>${esc(x.name)}</td><td>${esc(x.lot)}</td><td>${esc(x.exp)}</td><td>${x.qty===0?'Archivado (0)':x.qty}</td><td><button class="action secondary" onclick="editLot(${i})">Editar ficha</button> <button class="action secondary" onclick="lotHistory(${i})">Historial</button></td></tr>`).join('')}</tbody></table></div><div id="lot-history"></div><div class="actions"><button class="action" onclick="go('Recepción OCASA')">🚚 Ingresar provisión OCASA</button><button class="action secondary" onclick="go('Biológicos')">Ver existencias</button></div></div>`}

// ── Solicitudes mensuales ─────────────────────────────────────
// Los ítems del pedido se guardan como {bioId, bioName, qty, type}
// type: 'bio' | 'des'
// NO hay lista hardcodeada: siempre viene de catalog / desCatalog (Firebase)

function monthLabel(m){let[y,n]=m.split('-').map(Number);return new Date(y,n-1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'})}
function requestKey(){return requestMonth+'|'+(activeFacilityId||('aps:'+activeSector))}
function currentRequest(){
  let r=monthlyRequests[requestKey()];
  if(!r) r={items:[],desItems:[],status:'Borrador'};
  if(!r.items) r.items=[];
  if(!r.desItems) r.desItems=[];
  return r;
}
window.setRequestMonth=function(v){if(!/^\d{4}-\d{2}$/.test(v))return;requestMonth=v;render()};

// Buscador biológicos
window.reqBioSearch=function(){
  const q=($('reqBioInput')||{value:''}).value.trim().toLowerCase();
  const box=$('reqBioResults');
  if(!box)return;
  if(!q){box.innerHTML='';return;}
  const r=currentRequest();
  const usedIds=new Set((r.items||[]).map(x=>x.bioId));
  const matches=(bioCatalog||[]).filter(b=>b.active!==false&&b.name.toLowerCase().includes(q)&&!usedIds.has(b._id)).slice(0,8);
  box.innerHTML=matches.length
    ?matches.map(b=>`<div class="req-suggestion" onclick="reqBioAdd('${esc(b._id)}','${esc(b.name).replace(/'/g,"\\'")}')"><span>💉</span> ${esc(b.name)}</div>`).join('')
    :'<div class="req-no-match">Sin coincidencias en el catálogo</div>';
};
window.reqBioAdd=function(id,name){
  if(role==='consulta')return;
  let r=currentRequest();
  if(r.status==='Enviada')return;
  if((r.items||[]).find(x=>x.bioId===id))return;
  r.items=[...(r.items||[]),{bioId:id||name,bioName:name,qty:1}];
  monthlyRequests[requestKey()]=r;
  const inp=$('reqBioInput');if(inp)inp.value='';
  const box=$('reqBioResults');if(box)box.innerHTML='';
  _renderReqBioList(r);
  _renderReqTotals(r);
};
window.reqBioQty=function(id,v){
  if(role==='consulta')return;
  let r=currentRequest();
  if(r.status==='Enviada')return;
  let n=Number(v);if(!Number.isInteger(n)||n<0||n>99999)return;
  let item=(r.items||[]).find(x=>x.bioId===id);
  if(item)item.qty=n;
  monthlyRequests[requestKey()]=r;
  _renderReqTotals(r);
};
window.reqBioRemove=function(id){
  if(role==='consulta')return;
  let r=currentRequest();
  if(r.status==='Enviada')return;
  r.items=(r.items||[]).filter(x=>x.bioId!==id);
  monthlyRequests[requestKey()]=r;
  _renderReqBioList(r);
  _renderReqTotals(r);
};

function _reqItemRow(item,removeFn,qtyFn,disabled){
  const id=item.bioId;
  const safeId=id.replace(/'/g,"\\'");
  return`<div class="stock-row" id="reqrow-${esc(id)}" style="gap:10px;padding:12px 14px">
    <div style="flex:1;min-width:0"><strong style="font-size:15px;line-height:1.3">${esc(item.bioName)}</strong></div>
    <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
      <input type="number" inputmode="numeric" min="0" step="1" value="${item.qty}"
        ${disabled?'disabled':''}
        onchange="${qtyFn}('${safeId}',this.value)"
        style="width:72px;padding:9px 8px;border-radius:10px;border:1px solid #888;background:var(--field);color:var(--ink);font-size:17px;font-weight:700;text-align:center">
      ${disabled?'':`<button style="background:#c0392b22;color:#e74c3c;border:1px solid #c0392b44;border-radius:10px;padding:9px 13px;font-size:17px;cursor:pointer;min-height:42px;font-weight:700" onclick="${removeFn}('${safeId}')">✕</button>`}
    </div>
  </div>`;
}

function _renderReqBioList(r){
  const el=$('reqBioList');if(!el)return;
  const locked=r.status==='Enviada'||role==='consulta';
  el.innerHTML=(r.items||[]).length
    ?(r.items||[]).map(item=>_reqItemRow(item,'reqBioRemove','reqBioQty',locked)).join('')
    :'<p class="muted" style="padding:10px 0">Buscá un biológico arriba para agregarlo.</p>';
}
function _renderReqDesList(r){
  const el=$('reqDesList');if(!el)return;
  const locked=r.status==='Enviada'||role==='consulta';
  el.innerHTML=(r.desItems||[]).length
    ?(r.desItems||[]).map(item=>_reqItemRow(item,'reqDesRemove','reqDesQty',locked)).join('')
    :'<p class="muted" style="padding:10px 0">Buscá un insumo arriba para agregarlo.</p>';
}
function _renderReqTotals(r){
  const totalBio=(r.items||[]).reduce((a,x)=>a+Number(x.qty||0),0);
  const totalDes=(r.desItems||[]).reduce((a,x)=>a+Number(x.qty||0),0);
  const el=$('requestTotal');if(el)el.textContent=(totalBio+totalDes)+' unidades';
}

window.sendRequest=async function(){
  if(role==='administrador'||role==='consulta')return;
  let r=currentRequest();
  if(r.status==='Enviada')return;
  const items=(r.items||[]).map(x=>({bioId:x.bioId,bioName:x.bioName,qty:Number($('reqrow-'+x.bioId)?.querySelector('input')?.value??x.qty)}));
  const desItems=(r.desItems||[]).map(x=>({bioId:x.bioId,bioName:x.bioName,qty:Number($('reqrow-'+x.bioId)?.querySelector('input')?.value??x.qty)}));
  if(!items.length&&!desItems.length)return alert('Agregá al menos un biológico o insumo para enviar el pedido.');
  if([...items,...desItems].some(x=>x.qty<0))return alert('Las cantidades no pueden ser negativas.');
  const key=requestKey();
  const data={items,desItems,status:'Enviada',sector:activeSector,facilityId:activeFacilityId,facilityName:activePlace(),month:requestMonth,updated:new Date().toISOString()};
  monthlyRequests[key]={...data,id:key};
  await setDoc(doc(db,COL_REQ,key),data);
  render();
  alert('Solicitud enviada y guardada en Firebase.');
};

window.reopenRequest=async function(){
  if(role!=='administrador')return;
  let n=$('reopenSector').value;
  let key=requestMonth+'|'+n;
  if(!monthlyRequests[key])return alert('No hay solicitud de ese sector.');
  monthlyRequests[key].status='Borrador';
  await setDoc(doc(db,COL_REQ,key),{...monthlyRequests[key]});
  render();
};

window.exportMonthly=function(){
  if(role!=='administrador')return;
  let req=Object.values(monthlyRequests).filter(r=>r.month===requestMonth&&r.status==='Enviada');
  // Recopilar todos los biológicos únicos pedidos
  const allBioIds=[...new Set(req.flatMap(r=>(r.items||[]).map(x=>x.bioId)))];
  const allDesIds=[...new Set(req.flatMap(r=>(r.desItems||[]).map(x=>x.bioId)))];
  const getBioName=id=>{for(const r of req){const f=(r.items||[]).find(x=>x.bioId===id);if(f)return f.bioName;}return id;};
  const getDesName=id=>{for(const r of req){const f=(r.desItems||[]).find(x=>x.bioId===id);if(f)return f.bioName;}return id;};
  const cols=req.map(r=>r.facilityName||sectors[(r.sector||1)-1]);
  let rows=[['','Tipo',...cols,'Total']];
  for(const bid of allBioIds){
    const qtys=req.map(r=>{const f=(r.items||[]).find(x=>x.bioId===bid);return f?Number(f.qty||0):0;});
    rows.push([getBioName(bid),'Biológico',...qtys,qtys.reduce((a,b)=>a+b,0)]);
  }
  for(const did of allDesIds){
    const qtys=req.map(r=>{const f=(r.desItems||[]).find(x=>x.bioId===did);return f?Number(f.qty||0):0;});
    rows.push([getDesName(did),'Insumo',...qtys,qtys.reduce((a,b)=>a+b,0)]);
  }
  let csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n');
  let a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.href=url;a.download='Solicitud_mensual_'+requestMonth+'.csv';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};

function monthlyPage(){

  if(role!=='administrador'){
    let r=currentRequest(),locked=r.status==='Enviada'||role==='consulta';
    const bioListHtml=(r.items||[]).length
      ?(r.items||[]).map(item=>_reqItemRow(item,'reqBioRemove','reqBioQty',locked)).join('')
      :'<p class="muted" style="padding:10px 0">Buscá un biológico arriba para agregarlo.</p>';
    const desListHtml=(r.desItems||[]).length
      ?(r.desItems||[]).map(item=>_reqItemRow(item,'reqDesRemove','reqDesQty',locked)).join('')

    const totalBio=(r.items||[]).reduce((a,x)=>a+Number(x.qty||0),0);

    return`<div class="panel">

      <h2 style="margin-top:22px">🩺 Descartables</h2>

          ?'<div class="notice">Perfil Consulta: solo lectura.</div>'

            ?'<div class="notice">Solicitud enviada. Solo el administrador puede reabrirla.</div>'
            :'<button class="action" onclick="sendRequest()">Enviar solicitud mensual</button>'}
      </div>
    </div>`;
  }
  // Vista administrador
  let req=Object.values(monthlyRequests).filter(r=>r.month===requestMonth&&r.status==='Enviada');
  let all=Object.values(monthlyRequests).filter(r=>r.month===requestMonth);
  const allBioIds=[...new Set(req.flatMap(r=>(r.items||[]).map(x=>x.bioId)))];
  const allDesIds=[...new Set(req.flatMap(r=>(r.desItems||[]).map(x=>x.bioId)))];
  const getBioName=id=>{for(const r of req){const f=(r.items||[]).find(x=>x.bioId===id);if(f)return f.bioName;}return id;};
  const getDesName=id=>{for(const r of req){const f=(r.desItems||[]).find(x=>x.bioId===id);if(f)return f.bioName;}return id;};
  const totalDoses=req.reduce((a,r)=>{
    const b=(r.items||[]).reduce((x,y)=>x+Number(y.qty||0),0);
    const d=(r.desItems||[]).reduce((x,y)=>x+Number(y.qty||0),0);
    return a+b+d;
  },0);
  return`<div class="panel">
    <h1>Consolidado mensual</h1>

let movementSaving=false;
window.saveMove=async function(){
  if(movementSaving)return;
  if(role==='consulta')return alert('El perfil Consulta no puede registrar movimientos.');
  const category=(page==='Nuevo Entrante'||page==='Comprobación')?'Biológicos':moveCategory;
  const stock=category==='Biológicos'?items:disposables;
  const idx=Number($('mitem')?.value),x=stock[idx],qty=Number($('mqty')?.value),date=$('mdate')?.value,person=$('mperson')?.value.trim();
  const isExit=page==='Nuevo Saliente',isReturn=page==='Retorno',isEntry=page==='Nuevo Entrante',isAdjust=page==='Comprobación';
  if((isEntry||isAdjust)&&role!=='administrador')return alert('Operación exclusiva del administrador.');
  const dest=(isExit||isReturn)?(role==='administrador'?destinationValue('m'):(activeFacility()?{kind:activeFacility().kind,place:activeFacility().name,sector:String(activeFacility().sector||'')}:null)):null;
  const place=dest?dest.kind+' — '+dest.place:($('mplace')?.value||'').trim();
  if((isExit||isReturn)&&role!=='administrador'&&!permittedFacilities().some(f=>f.id===activeFacilityId))return alert('No tenés un establecimiento autorizado.');
  if((isExit||isReturn)&&!dest)return alert('No se identificó el efector del movimiento.');
  if(!x||!date||!person||!place||!Number.isInteger(qty)||qty===0||(!isAdjust&&qty<1))return alert('Completá los datos y una cantidad válida.');
  if(isReturn){
    const balance=docs.filter(d=>d.category===category&&d.itemRef===x._id&&d.place===place).reduce((a,d)=>a+(d.type==='Nuevo Saliente'?d.qty:d.type==='Retorno'?-d.qty:0),0);
    if(qty>balance)return alert('No se puede retornar más de lo entregado al mismo efector. Saldo pendiente: '+balance);
  }
  const delta=isExit?-qty:isReturn?(category==='Biológicos'?0:qty):qty;
  if(isExit&&category==='Biológicos'&&x.exp&&x.exp<new Date().toLocaleDateString('en-CA'))return alert('Lote vencido: no puede distribuirse.');
  if(x.qty+delta<0)return alert('No hay existencias suficientes.');
  movementSaving=true;
  x.qty+=delta;
  const number=(category==='Biológicos'?'BIO':'DES')+'-'+String(nextDoc++).padStart(4,'0');
  const newDoc={number,date,category,type:page,name:x.name+(x.lot?' / '+x.lot:''),itemRef:x._id||null,qty,place,person,comment:($('mcomment')?.value||'').trim(),status:isReturn&&category==='Biológicos'?'Pendiente de verificación':'Registrado',userEmail:sessionAccount?.email||'',userName:sessionAccount?.name||''};
  docs.unshift(newDoc);
  await persistItem(x);
  await persistDoc(newDoc);
  if(isReturn&&category==='Biológicos')alert('Retorno registrado como pendiente de verificación. No se sumó al stock disponible.');
  else alert('Comprobante '+number+' registrado y guardado en Firebase.');
  moveCategory='';go('Movimientos');movementSaving=false;
};

window.ocasaAddRow=function(){

  if(esBio&&!bioCatalog.some(b=>b.name===nombre&&b.active!==false))return alert('Seleccioná un biológico activo del catálogo.');
  if(!esBio&&!desCatalog.some(d=>d.name===nombre&&d.active!==false))return alert('Seleccioná un insumo activo del catálogo de descartables.');
  const date=ocasaHeader?.date||new Date().toLocaleDateString('en-CA');

  // actualizar contador en el h2
  document.querySelectorAll('[data-ocasa-count]').forEach(el=>el.textContent=ocasaRows.length);
  // mostrar/ocultar botón confirmar según si hay ítems
  document.querySelectorAll('[data-ocasa-confirm]').forEach(el=>el.style.display=ocasaRows.length?'':'none');
}
window.confirmOcasaRemito=async function(){
  if(role!=='administrador')return alert('Solo administrador.');
  if(!ocasaHeader)return alert('Primero confirmá la cabecera del remito.');
  const date=ocasaHeader.date;
  const ref=ocasaHeader.ref;
  const person=ocasaHeader.person;
  const notes=ocasaHeader.notes||'';
  if(!ocasaRows.length)return alert('Agregá al menos un ítem al remito antes de confirmar.');
  const nBio=ocasaRows.filter(r=>r.tipo==='Biológico').length;
  const nDes=ocasaRows.filter(r=>r.tipo==='Descartable').length;
  const resumen=[nBio?`${nBio} biológico(s)`:'',nDes?`${nDes} descartable(s)`:''].filter(Boolean).join(' + ');
  if(!confirm(`Confirmar remito ${ref}\n${resumen} · ${ocasaRows.reduce((a,r)=>a+r.qty,0)} unidades en total\nResponsable: ${person}`))return;
  let errores=[];
  for(const r of ocasaRows){
    if(r.tipo==='Biológico'){
      let idx=items.findIndex(x=>x.name.toLowerCase()===r.nombre.toLowerCase()&&x.lot.toLowerCase()===r.lote.toLowerCase());
      if(idx>=0&&items[idx].exp!==r.exp){errores.push(`Lote ${r.lote} de "${r.nombre}" ya existe con otro vencimiento.`);continue;}
      if(idx>=0)items[idx].qty+=r.qty;
      else{const newItem={name:r.nombre,lot:r.lote,exp:r.exp,qty:r.qty};const fref=doc(collection(db,COL_ITEMS));newItem._id=fref.id;await setDoc(fref,itemData(newItem));items.push(newItem);idx=items.length-1;}
      await persistItem(items[idx]);
      const number='BIO-'+String(nextDoc++).padStart(4,'0');
      const newDoc={number,date,category:'Biológicos',type:'Recepción OCASA',name:r.nombre+' / '+r.lote,itemRef:items[idx]._id||null,qty:r.qty,place:'Nivel central / OCASA · '+ref,person,comment:notes,status:'Registrado',userEmail:sessionAccount?.email||'',userName:sessionAccount?.name||''};
      docs.unshift(newDoc);await persistDoc(newDoc);
    } else {
      // Descartable: suma al stock existente o crea nuevo
      let d=disposables.find(x=>x.name.toLowerCase()===r.nombre.toLowerCase());
      if(d)d.qty+=r.qty;
      else{disposables.push({name:r.nombre,qty:r.qty,unit:'unidades'});d=disposables.at(-1);}
      await persistDisposables();
      const number='DES-'+String(nextDoc++).padStart(4,'0');
      const newDoc={number,date,category:'Descartables',type:'Recepción OCASA',name:r.nombre,itemRef:null,qty:r.qty,place:'Nivel central / OCASA · '+ref,person,comment:notes,status:'Registrado',userEmail:sessionAccount?.email||'',userName:sessionAccount?.name||''};
      docs.unshift(newDoc);await persistDoc(newDoc);
    }
  }
  if(errores.length)alert('⚠ Los siguientes lotes se saltaron por conflicto de vencimiento:\n'+errores.join('\n'));
  else alert(`✓ Remito ${ref} confirmado. ${ocasaRows.length} comprobante(s) generados en Firebase.`);
  ocasaRows=[];
  ocasaHeader=null;
  go('Control diario');
};

      const cat=(inb||adj)?'Biológicos':moveCategory;
      const stock=cat==='Biológicos'?items:disposables;
      h=`<div class="panel"><h1>${page} · ${cat}</h1><p class="muted">${ret?'Devolución de artículos previamente entregados al mismo efector. Los biológicos retornados quedan pendientes de verificación.':out?'La salida descuenta existencias del inventario central.':'Movimiento exclusivo del administrador.'}</p>${(ret||out)?`<button class="action secondary" onclick="chooseCategory('')">← Cambiar inventario</button>`:''}<div class="grid" style="margin-top:15px"><div class="field"><label>Fecha</label><input type="date" id="mdate" value="${new Date().toLocaleDateString('en-CA')}"></div><div class="field"><label>${cat==='Biológicos'?'Biológico y lote':'Insumo descartable'}</label><select id="mitem">${stock.map((x,i)=>({x,i})).filter(({x})=>ret||adj||inb||(x.qty>0&&(cat!=='Biológicos'||!x.exp||x.exp>=new Date().toLocaleDateString('en-CA')))).map(({x,i})=>`<option value="${i}">${esc(x.name)} ${x.lot?'· '+esc(x.lot):''} · Disponible ${x.qty}</option>`).join('')}</select></div><div class="field"><label>${adj?'Variación de stock (+/-)':'Cantidad de '+(cat==='Biológicos'?'dosis':'unidades')}</label><input type="number" id="mqty" value="1" ${adj?'':'min="1"'}></div>${inb||adj?'<div class="field"><label>'+(inb?'Origen / proveedor':'Motivo de comprobación')+'</label><input id="mplace" placeholder="Indicar origen o motivo"></div>':(role==='administrador'?destinationFields('m'):`<div class="field"><label>Efector asignado</label><input value="${esc(activePlace())}" readonly aria-readonly="true"><small>Asignación automática; no puede cambiarse en el formulario.</small></div>`)}<div class="field"><label>Responsable</label><input id="mperson" placeholder="Nombre del responsable"></div><div class="field"><label>Observaciones</label><input id="mcomment" placeholder="Opcional"></div></div><div class="actions"><button class="action" onclick="saveMove()">Guardar ${ret?'retorno':out?'salida':'movimiento'}</button></div></div>`;
    }
  }
  if(page==='Informes'){let total=items.reduce((a,x)=>a+x.qty,0);h=`<div class="panel"><h1>Informes</h1><div class="stats"><div class="stat"><b>${total}</b><small>Dosis en inventario</small></div><div class="stat"><b>${docs.filter(d=>d.type==='Retorno').length}</b><small>Retornos</small></div><div class="stat"><b>${docs.filter(d=>d.type==='Nuevo Saliente').length}</b><small>Salidas</small></div><div class="stat"><b>${docs.filter(d=>d.type==='Comprobación').length}</b><small>Comprobaciones</small></div></div><button class="action" onclick="exportCsv()">Exportar inventario CSV</button></div>`}
  if(page==='Administrar destinos'){h=role==='administrador'?destinationsAdmin():'<div class="panel">Función exclusiva del administrador.</div>'}

  if(page==='Usuarios y efectores'&&role!=='administrador'){h='<div class="panel">Función exclusiva del administrador.</div>'}
  else if(page==='Usuarios y efectores'){
    h=`<div class="panel"><h1>Gestión de usuarios y establecimientos</h1><p class="muted">Tres perfiles: Administrador, Usuario y Consulta. Los usuarios se guardan en Firebase y pueden ingresar desde cualquier dispositivo con su contraseña.</p><div class="notice">🔒 Las contraseñas se guardan cifradas (SHA-256). No se recuperan: si un usuario olvida su contraseña, el administrador debe asignarle una nueva.</div><h2 style="margin-top:20px">Agregar usuario</h2><div class="grid"><div class="field"><label>Apellido y nombre</label><input id="uname" placeholder="Responsable"></div><div class="field"><label>Usuario (alias o correo)</label><input id="uemail" type="text" placeholder="usuario@aps.com o alias corto" autocapitalize="off"></div><div class="field"><label>Contraseña inicial</label><input id="upass" type="password" placeholder="Mínimo 4 caracteres"></div><div class="field"><label>Perfil</label><select id="urole"><option>Usuario</option><option>Administrador</option><option>Consulta</option></select></div></div><h2 style="margin-top:20px">Establecimientos autorizados</h2><p class="muted">Marcá uno o varios sectores, centros o puestos.</p>${facilityChecklist()}<details id="userQuickCreate" style="margin-top:14px" ontoggle="rememberUserDraft()"><summary class="action secondary" style="cursor:pointer">+ Crear establecimiento sin salir</summary><div class="grid" style="margin-top:14px"><div class="field"><label>Tipo de establecimiento</label><select id="quickkind">${kinds.filter(k=>k!=='Sector APS').map(k=>`<option>${esc(k)}</option>`).join('')}</select></div><div class="field"><label>Nombre</label><input id="quickname" placeholder="Ej. Centro Materno Infantil"></div></div><button class="action secondary" onclick="rememberUserDraft();createFacilityFromUser()">Crear y seleccionar</button></details><div class="actions"><button class="action" onclick="addUser()">Guardar usuario en Firebase</button><button class="action secondary" onclick="exportAccounts()">Exportar lista (sin contraseñas)</button></div></div><div class="panel hidden" id="userEditor"></div><div class="panel"><h2>Usuarios registrados</h2><div class="tablewrap"><table><thead><tr><th>Responsable</th><th>Identificador</th><th>Establecimientos</th><th>Perfil</th><th>Estado</th><th>Editar</th></tr></thead><tbody>${users.map((u,i)=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${userFacilityIds(u).map(id=>facilityList().find(f=>f.id===id)?.name||'—').map(esc).join('<br>')||'Sin asignar'}</td><td>${esc(normalizeRole(u.role))}</td><td><button class="action secondary" onclick="toggleAccount('${u.id}')">${u.active===false?'Inactivo · activar':'Activo · desactivar'}</button></td><td><button class="action secondary" onclick="showUserEdit('${u.id}')">Editar</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">No hay usuarios registrados</td></tr>'}</tbody></table></div></div>`;
  }

  $('content').innerHTML=(page==='Inicio'?h:`<div class="sub-head"><button class="back" onclick="go('Inicio')" aria-label="Volver">‹</button><h1>${esc(page)}</h1></div><div class="page-container">${h}</div>`);
  if(page==='Biológicos')drawItems();
  if(page==='Control diario')dailyReport();
  // sincronizar botón de tema si está en pantalla
  const _btn=document.getElementById('themeCycleBtn');
  if(_btn){const _labels={dark:'🌙 Oscuro — tocar para cambiar',light:'☀️ Claro — tocar para cambiar',auto:'⚙️ Sistema — tocar para cambiar'};_btn.textContent=_labels[currentTheme]||_labels.dark;}
};

// ── Arrancar ──────────────────────────────────────────────────
cargarTodo();
</script>
</body></html>
