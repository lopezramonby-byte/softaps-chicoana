    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #f59e0b;
            --secondary: #fbbf24;
            --accent: #f97316;
            --success: #10b981;
            --bg-dark: #1f2937;
            --bg-card: #374151;
            --text-primary: #f9fafb;
            --text-secondary: #9ca3af;
            --border: #4b5563;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1f2937 0%, #374151 50%, #1f2937 100%);
            min-height: 100vh;
            color: var(--text-primary);
        }
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }
        .header h1 { font-size: 1.5rem; margin-bottom: 5px; }
        .header p { font-size: 0.85rem; opacity: 0.95; }
        .stats {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }
        .stat {
            background: rgba(255,255,255,0.15);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .search-box {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
        }
        .search-input {
            width: 100%;
            padding: 10px 15px;
            font-size: 0.95rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--bg-dark);
            color: var(--text-primary);
            outline: none;
            margin-bottom: 10px;
        }
        .search-input:focus { border-color: var(--primary); }
        .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .filter-btn {
            padding: 6px 12px;
            border: 2px solid var(--border);
            background: var(--bg-dark);
            color: var(--text-secondary);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .filter-btn.active, .filter-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .clear-btn {
            margin-left: auto;
            padding: 6px 12px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .results-box {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid var(--border);
        }
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--border);
            font-size: 0.9rem;
        }
        .export-btn {
            padding: 6px 12px;
            background: var(--success);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .results-list {
            max-height: 60vh;
            overflow-y: auto;
        }
        .code-item {
            background: var(--bg-dark);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .code-item:hover {
            border-color: var(--primary);
            transform: translateX(3px);
        }
        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .code-num {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
            background: rgba(245, 158, 11, 0.15);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }
        .copy-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
        }
        .copy-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .code-desc {
            font-size: 0.85rem;
            color: var(--text-primary);
            line-height: 1.3;
        }
        .code-cat {
            display: inline-block;
            margin-top: 4px;
            padding: 1px 6px;
            background: rgba(251, 191, 36, 0.15);
            color: var(--secondary);
            border-radius: 8px;
            font-size: 0.65rem;
        }
        .empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--success);
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            transform: translateX(400px);
            transition: transform 0.3s;
            z-index: 1000;
            font-size: 0.85rem;
        }
        .toast.show { transform: translateX(0); }
        .highlight { background: rgba(251, 191, 36, 0.4); padding: 0 2px; border-radius: 2px; }
    </style>
</head>

        let currentFilter = 'all';
        let searchTerm = '';
        let searchTimeout = null;
        const DISPLAY_LIMIT = 100;

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('totalCodes').textContent = `${db.length} códigos disponibles`;
            document.getElementById('searchInput').addEventListener('input', handleSearch);
            
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    currentFilter = e.currentTarget.dataset.filter;
                    handleSearch();
                });
            });
        });

        function handleSearch() {
            const searchInput = document.getElementById('searchInput');
            searchTerm = searchInput.value.toLowerCase().trim();
            
            if (searchTimeout) {
                clearTimeout(searchTimeout);
            }
            
            searchTimeout = setTimeout(() => {
                if (!searchTerm) {
                    showEmptyState();
                    return;
                }

                const results = filterResults();
                displayResults(results);
            }, 300);
        }

        function filterResults() {
            return db.filter(item => {
                const code = item[0] || '';
                const desc = item[1] || '';
                const codeMatch = code.toLowerCase().includes(searchTerm);
                const descMatch = desc.toLowerCase().includes(searchTerm);

                if (currentFilter === 'code') return codeMatch;
                if (currentFilter === 'desc') return descMatch;
                return codeMatch || descMatch;
            });
        }

        function displayResults(results) {
            const resultsList = document.getElementById('resultsList');
            const resultCount = document.getElementById('resultCount');
            
            const totalResults = results.length;
            const displayResults = results.slice(0, DISPLAY_LIMIT);
            
            resultCount.textContent = totalResults;

            if (totalResults === 0) {
                resultsList.innerHTML = `
                    <div class="empty">
                        <div style="font-size: 3rem; margin-bottom: 10px;">🔍</div>
                        <h3>Sin resultados</h3>
                        <p>No se encontraron códigos</p>
                    </div>
                `;
                return;
            }

            resultsList.innerHTML = displayResults.map((item) => {
                const code = item[0] || '';
                const desc = item[1] || '';
                const highlightedDesc = highlightText(desc, searchTerm);
                const highlightedCode = highlightText(code, searchTerm);
                const category = getCategory(code);
                
                return `
                    <div class="code-item" onclick="copyCode('${code}')">
                        <div class="code-header">
                            <div class="code-num">${highlightedCode}</div>
                            <button class="copy-btn" onclick="event.stopPropagation(); copyCode('${code}')" title="Copiar código">
                                <i class="fas fa-copy"></i>
                            </button>
                        </div>
                        <div class="code-desc">${highlightedDesc}</div>
                        <span class="code-cat">${category}</span>
                    </div>
                `;
            }).join('');
            
            if (totalResults > DISPLAY_LIMIT) {
                const moreMsg = document.createElement('div');
                moreMsg.style.cssText = 'text-align: center; padding: 15px; color: var(--text-secondary); font-size: 0.9rem;';
                moreMsg.textContent = `⚠️ Mostrando ${DISPLAY_LIMIT} de ${totalResults} resultados. Refina tu búsqueda.`;
                resultsList.appendChild(moreMsg);
            }
        }

        function highlightText(text, term) {
            if (!term) return text;
            const regex = new RegExp(`(${term})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        function getCategory(code) {
            const firstChar = code.charAt(0);
            const categories = {
                '0': 'Procedimientos',
                'A': 'Enfermedades Infecciosas',
                'B': 'Enfermedades Infecciosas',
                'C': 'Neoplasias',
                'D': 'Sangre',
                'E': 'Endocrinas',
                'F': 'Salud Mental',
                'G': 'Sistema Nervioso',
                'H': 'Ojo y Oído',
                'I': 'Sistema Circulatorio',
                'J': 'Sistema Respiratorio',
                'K': 'Sistema Digestivo',
                'L': 'Piel',
                'M': 'Sistema Osteomuscular',
                'N': 'Sistema Genitourinario',
                'O': 'Embarazo',
                'P': 'Perinatal',
                'Q': 'Malformaciones',
                'R': 'Síntomas',
                'S': 'Lesiones',
                'T': 'Lesiones',
                'U': 'Uso Emergente',
                'V': 'Causas Externas',
                'W': 'Causas Externas',
                'X': 'Causas Externas',
                'Y': 'Causas Externas',
                'Z': 'Factores'
            };
            return categories[firstChar] || 'Otros';
        }

        function showEmptyState() {
            document.getElementById('resultsList').innerHTML = `
                <div class="empty">
                    <div style="font-size: 3rem; margin-bottom: 10px;">🔬</div>
                    <h3>Comienza a buscar</h3>
                    <p>Escribe un código o descripción</p>
                </div>
            `;
            document.getElementById('resultCount').textContent = '0';
        }

        function copyCode(code) {
            navigator.clipboard.writeText(code).then(() => {
                showToast(`Código ${code} copiado`);
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            searchTerm = '';
            showEmptyState();
            document.getElementById('searchInput').focus();
        }

        function exportResults() {
            const results = filterResults();
            if (results.length === 0) {
                showToast('No hay resultados');
                return;
            }

            let csv = 'CODIGO,DESCRIPCION\n';
            results.forEach(item => {
                const code = item[0] || '';
                const desc = item[1] || '';
                csv += `${code},"${desc.replace(/"/g, '""')}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `CIE10_${new Date().toISOString().split('T')[0]}.csv`;
            link.click();
            
            showToast(`${results.length} códigos exportados`);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                clearSearch();
            }
        });
    </script>
